<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-section brand">
        <h3 class="footer-logo">Oak & Code</h3>
        <p class="footer-tagline">Craftsmanship meets innovation</p>
        <p class="footer-description">
          Building digital experiences that transform businesses and delight users.
        </p>
      </div>

      <div class="footer-section links">
        <h4 class="footer-title">Quick Links</h4>
        <ul class="footer-links">
          <li *ngFor="let link of quickLinks">
            <a [href]="link.url">{{ link.name }}</a>
          </li>
        </ul>
      </div>

      <div class="footer-section social">
        <h4 class="footer-title">Connect With Us</h4>
        <div class="social-links">
          <a *ngFor="let social of socialLinks"
             [href]="social.url"
             [title]="social.name"
             class="social-link">
            {{ social.icon }}
          </a>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="copyright">
        © {{ currentYear }} Oak & Code. All rights reserved.
      </p>
      <p class="made-with">
        Made with ❤️ by a team born from chaos
      </p>
    </div>
  </div>
</footer>
